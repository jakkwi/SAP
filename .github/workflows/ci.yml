name: CI

# One pipeline for the whole portfolio. Every top-level folder that contains a
# package.json is discovered automatically and linted, transpiled and unit
# tested in parallel, so adding a new mini project needs no CI changes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: find
        name: Collect project folders
        run: |
          projects=$(find . -mindepth 2 -maxdepth 2 -name package.json \
            -not -path './_*' -not -path './.*' -printf '%h\n' \
            | sed 's|^\./||' \
            | sort \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "Discovered projects: $projects"
          if [ "$projects" = "[]" ]; then
            echo "::error::No project folders found - expected at least one <project>/package.json"
            exit 1
          fi
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.project }}
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static analysis (abaplint)
        run: npm run lint

      - name: Transpile ABAP to JavaScript
        run: npm run transpile

      - name: Run ABAP Unit tests
        run: npm run unit

  gate:
    name: All checks passed
    needs: build
    if: always()
    runs-on: ubuntu-latest

    # A single, stable status check for branch protection to require. The build
    # job is a matrix that grows with every new project, so its leg names are a
    # moving target; this job is not. It passes only when every leg passed.
    steps:
      - name: Require every project build to have succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::At least one project failed lint, transpile or unit tests"
            exit 1
          fi
          echo "Every project passed lint, transpile and ABAP Unit."
